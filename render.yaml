services:
  - type: web
    name: sdp-for-github-backend
    env: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://sdp-for-git-hub.vercel.app
      - key: ALLOW_LOCAL_CACHE_MODE
        value: false
      - key: MAX_SOURCE_FILES_PER_RUN
        value: 500
      - key: SDP_TEMP_REPO_DIR
        value: /tmp/sdp_github_temp_repos


